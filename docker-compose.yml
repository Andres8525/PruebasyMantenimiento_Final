services:
  # Semana 5 — Servidor API objetivo
  api-service:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: api_objetivo
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Contenedor ejecutor de pruebas (efímero): corre TODA la suite y deja reportes
  test-runner:
    build:
      context: .
      dockerfile: docker/qa.Dockerfile
    container_name: ejecutor_pruebas
    depends_on:
      api-service:
        condition: service_healthy
    environment:
      - API_URL=http://api-service:8000
    volumes:
      - ./reports:/workspace/reports

  # Dashboard de calidad: lee los reportes y permite relanzar las pruebas
  dashboard:
    build:
      context: .
      dockerfile: docker/qa.Dockerfile
    container_name: dashboard_calidad
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    depends_on:
      api-service:
        condition: service_healthy
    environment:
      - API_URL=http://api-service:8000
    volumes:
      - ./reports:/workspace/reports

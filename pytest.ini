[pytest]
# Raíz del proyecto en el path para importar "src" sin ModuleNotFoundError (Semana 3)
pythonpath = .
testpaths = tests
# Quality Gate: cobertura sobre src/ con mínimo 80% (Semana 3)
addopts = -ra --cov=src --cov-report=term-missing --cov-fail-under=80
markers =
    semana1: Patrón AAA y Pytest
    semana2: Valores Límite (BVA) y Parametrización
    semana3: Cobertura de Código y Quality Gates
    semana5: Pruebas de API en Contenedores

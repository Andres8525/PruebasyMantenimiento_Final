name: CI - Quality Gate

on:
  push:
  pull_request:

jobs:
  # Semanas 1-3 (+5 en modo local): pruebas unitarias, BVA y Quality Gate de cobertura
  pruebas-unitarias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar suite + Quality Gate (cobertura >= 80%)
        run: python scripts/run_tests.py

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: reports/

  # Semana 5: API y test-runner en contenedores (mismo comando que en clase)
  pruebas-contenedores:
    runs-on: ubuntu-latest
    needs: pruebas-unitarias
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose - API + test-runner
        run: docker compose up --build --exit-code-from test-runner api-service test-runner

      - name: Limpieza
        if: always()
        run: docker compose down

# Semana 6 — Integración Continua: cada push o pull request a main dispara
# build + pruebas. Si algo falla, el pipeline se pone rojo y bloquea la entrega.
name: CI Pipeline API Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Semanas 1-4, 6-8: pruebas unitarias/API + flake8 + Quality Gate (cobertura >= 80%)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas + linter + Quality Gate
        run: python scripts/run_tests.py

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-calidad
          path: reports/

  # Semanas 4-5: API y test-runner en contenedores sobre la red privada de Docker
  pruebas-contenedores:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Levantar entorno con Docker Compose y ejecutar pruebas
        run: docker compose up --build --exit-code-from test-runner api-service test-runner

      - name: Limpieza
        if: always()
        run: docker compose down

  # Semana 8: prueba de carga corta con Locust (headless)
  pruebas-carga:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Enjambre de 50 usuarios durante 20 s
        run: python scripts/run_load_test.py -u 50 -r 10 -t 20

      - name: Publicar reporte de carga
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-carga
          path: reports/carga/

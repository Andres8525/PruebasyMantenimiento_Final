# Cobertura usada cuando las pruebas de API apuntan a un contenedor externo (API_URL).
# En ese modo el código de la API corre en OTRO proceso/contenedor, así que no se
# puede medir desde aquí: se excluye para no castigar el Quality Gate injustamente.
[run]
branch = True
source = src
omit =
    src/semana5/*

[report]
show_missing = True
